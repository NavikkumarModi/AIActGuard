[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiactguard"
version = "0.1.0"
description = "Drop-in EU AI Act compliance middleware for agentic AI frameworks — audit trails, risk classification, and human-approval gates in one decorator."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["eu-ai-act", "compliance", "agentic-ai", "governance", "audit", "langchain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["aiactguard"]

[tool.hatch.build.targets.wheel.force-include]
"aiactguard/core/default_taxonomy.yaml" = "aiactguard/core/default_taxonomy.yaml"
"aiactguard/policy/default_policy.yaml" = "aiactguard/policy/default_policy.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
