# Default policy-as-code: what triggers a human-approval gate (Art. 14).
# Override per-org — e.g. widen categories, tighten/loosen the threshold.

gate_rules:
  - min_risk_tier: high
    categories: []   # empty list = applies to every Annex III category
    require_reason_on_override: true   # an approver overriding a denial must say why
